<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OD-11 · Model Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg-deep: #0c0e12;
      --ink: #e8e4dc;
      --ink-muted: #8a8790;
      --accent: #c4a574;
      --ring: rgba(232, 228, 220, 0.08);
      --panel: rgba(12, 14, 18, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--ink);
      font-family: "Instrument Sans", sans-serif;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg-deep);
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--bg-deep);
      --poster-color: transparent;
      --progress-bar-color: var(--accent);
      --progress-bar-height: 2px;
    }

    .chrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      z-index: 2;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .brand {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    .brand span {
      display: block;
      margin-top: 0.45rem;
      font-family: "Instrument Sans", sans-serif;
      font-size: clamp(0.8rem, 1.6vw, 0.95rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
    }

    .panel {
      pointer-events: auto;
      width: min(280px, 82vw);
      max-height: calc(100vh - 5rem);
      overflow: auto;
      padding: 1rem 1.1rem 1.1rem;
      background: var(--panel);
      border: 1px solid var(--ring);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    .panel h2 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.75rem;
    }

    .field {
      display: grid;
      grid-template-columns: 3.6rem 1fr 2.4rem;
      gap: 0.45rem;
      align-items: center;
      margin-bottom: 0.65rem;
    }

    .field label {
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .field output {
      font-size: 0.68rem;
      color: var(--ink-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .field input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0;
      border-top: 1px solid var(--ring);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .toggle {
      appearance: none;
      width: 2.1rem;
      height: 1.15rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--ring);
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 2px;
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      background: var(--ink-muted);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .toggle:checked {
      background: color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .toggle:checked::after {
      transform: translateX(0.85rem);
      background: var(--accent);
    }

    .panel-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--ring);
    }

    .panel-actions.embed-actions {
      grid-template-columns: 1fr;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
    }

    .panel-actions button {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--ring);
      color: var(--ink);
      font: inherit;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.45rem 0.3rem;
      cursor: pointer;
    }

    .panel-actions button:hover { background: rgba(255, 255, 255, 0.07); }

    .panel-actions button.primary {
      border-color: rgba(196, 165, 116, 0.45);
      background: rgba(196, 165, 116, 0.14);
      color: var(--accent);
    }

    .note {
      margin-top: 0.75rem;
      font-size: 0.68rem;
      line-height: 1.45;
      color: var(--ink-muted);
    }

    .note a {
      color: var(--accent);
      text-decoration: none;
    }

    .note a:hover { text-decoration: underline; }

    .toast {
      position: absolute;
      left: 50%;
      bottom: clamp(1.25rem, 4vw, 2.5rem);
      transform: translate(-50%, 8px);
      z-index: 5;
      pointer-events: none;
      padding: 0.65rem 0.9rem;
      background: rgba(12, 14, 18, 0.92);
      border: 1px solid rgba(196, 165, 116, 0.35);
      color: var(--ink);
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: min(90vw, 420px);
      text-align: center;
    }

    .toast.is-on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.is-embed .brand span { display: none; }
    body.is-embed .panel { display: none; }
    body.is-embed .hint { display: none; }
    body.is-embed .chrome { padding: 0.85rem 1rem; }
    body.is-embed .brand {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      opacity: 0.7;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--ink-muted);
      letter-spacing: 0.02em;
    }

    .hint kbd {
      display: inline-block;
      padding: 0.15em 0.45em;
      margin: 0 0.15em;
      border: 1px solid var(--ring);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.75rem;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.03);
    }

    .status {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 3;
      background: var(--bg-deep);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      text-align: center;
      width: min(220px, 60vw);
    }

    .loader-label {
      font-family: "Newsreader", Georgia, serif;
      font-size: 1.35rem;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
    }

    .track {
      height: 2px;
      background: var(--ring);
      overflow: hidden;
      border-radius: 1px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .pct {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .error {
      color: #e07070;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 28ch;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .top { flex-direction: column; }
      .panel { width: 100%; max-height: 48vh; }
      .hint kbd { display: none; }
      .hint { font-size: 0; }
      .hint::after {
        content: "Drag to orbit · Pinch to zoom";
        font-size: 0.8rem;
        color: var(--ink-muted);
      }
    }
  </style>
</head>
<body>
  <div class="viewer" id="viewer">
    <div class="loader" id="loader">
      <div class="loader-inner">
        <div class="loader-label" id="loaderLabel">OD-11</div>
        <div class="track"><div class="bar" id="bar"></div></div>
        <div class="pct" id="pct">0%</div>
      </div>
    </div>

    <model-viewer
      id="mv"
      src="./OD-11.glb"
      alt="OD-11 assembly"
      environment-image="./studio_small_09_4k.hdr"
      tone-mapping="aces"
      exposure="1.15"
      shadow-intensity="1"
      shadow-softness="0.6"
      camera-controls
      touch-action="pan-y"
      interaction-prompt="none"
      field-of-view="35deg"
      min-field-of-view="18deg"
      max-field-of-view="55deg"
      camera-orbit="40deg 65deg 105%"
      camera-target="auto auto auto"
      ar
      ar-modes="webxr scene-viewer quick-look"
    ></model-viewer>

    <div class="chrome">
      <div class="top">
        <h1 class="brand">
          OD-11
          <span>Model Viewer</span>
        </h1>

        <aside class="panel" aria-label="Viewer controls">
          <h2>Lighting</h2>

          <div class="field">
            <label for="exposure">Exposure</label>
            <input id="exposure" type="range" min="0.4" max="2.2" step="0.05" value="1.15" />
            <output id="exposureOut" for="exposure">1.15</output>
          </div>

          <div class="field">
            <label for="shadow">Shadow</label>
            <input id="shadow" type="range" min="0" max="2" step="0.05" value="1" />
            <output id="shadowOut" for="shadow">1.00</output>
          </div>

          <label class="toggle-row" for="autoRotate">
            Auto-rotate
            <input class="toggle" type="checkbox" id="autoRotate" />
          </label>

          <div class="panel-actions">
            <button type="button" id="btn-reset">Reset view</button>
            <button type="button" id="btn-ar">View in AR</button>
          </div>
          <div class="panel-actions embed-actions">
            <button type="button" class="primary" id="btn-copy-embed">Copy embed</button>
            <button type="button" id="btn-copy-url">Copy view URL</button>
          </div>

          <p class="note">
            No section planes here — use the
            <a href="./index.html">Three.js cross-section viewer</a>
            for cutting.
          </p>
        </aside>
      </div>

      <div class="footer">
        <p class="hint">
          <kbd>Drag</kbd> orbit
          <kbd>Scroll</kbd> zoom
          <kbd>Right-drag</kbd> / two-finger pan
        </p>
        <p class="status" id="status">Loading</p>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module">
    const mv = document.getElementById('mv');
    const loaderEl = document.getElementById('loader');
    const loaderLabel = document.getElementById('loaderLabel');
    const bar = document.getElementById('bar');
    const pct = document.getElementById('pct');
    const status = document.getElementById('status');
    const toast = document.getElementById('toast');
    const exposureInput = document.getElementById('exposure');
    const shadowInput = document.getElementById('shadow');
    const exposureOut = document.getElementById('exposureOut');
    const shadowOut = document.getElementById('shadowOut');
    const autoRotate = document.getElementById('autoRotate');

    const DEFAULT_ORBIT = '40deg 65deg 105%';
    const DEFAULT_TARGET = 'auto auto auto';
    const DEFAULT_FOV = '35deg';

    let toastTimer = 0;

    function setProgress(t) {
      const n = Math.max(0, Math.min(1, t || 0));
      bar.style.width = `${(n * 100).toFixed(1)}%`;
      pct.textContent = `${Math.round(n * 100)}%`;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-on'), 2200);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;left:-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          return ok;
        } catch {
          return false;
        }
      }
    }

    function roundn(n, d = 4) {
      const p = 10 ** d;
      return Math.round(n * p) / p;
    }

    function captureView({ embed = false } = {}) {
      return {
        e: embed ? 1 : 0,
        o: mv.getCameraOrbit?.()
          ? [
              roundn(mv.getCameraOrbit().theta * (180 / Math.PI), 2) + 'deg',
              roundn(mv.getCameraOrbit().phi * (180 / Math.PI), 2) + 'deg',
              roundn(mv.getCameraOrbit().radius, 4) + 'm',
            ].join(' ')
          : mv.cameraOrbit,
        t: mv.getCameraTarget?.()
          ? [
              roundn(mv.getCameraTarget().x, 4) + 'm',
              roundn(mv.getCameraTarget().y, 4) + 'm',
              roundn(mv.getCameraTarget().z, 4) + 'm',
            ].join(' ')
          : mv.cameraTarget,
        f: mv.getFieldOfView?.()
          ? roundn(mv.getFieldOfView(), 2) + 'deg'
          : mv.fieldOfView,
        x: roundn(Number(mv.exposure), 2),
        s: roundn(Number(mv.shadowIntensity), 2),
        r: autoRotate.checked ? 1 : 0,
      };
    }

    function encodeView(view) {
      return btoa(JSON.stringify(view))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    function decodeView(raw) {
      try {
        const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64 + '='.repeat((4 - (b64.length % 4)) % 4);
        return JSON.parse(atob(pad));
      } catch (err) {
        console.warn('Could not decode view param', err);
        return null;
      }
    }

    function applyView(view) {
      if (!view) return false;
      if (view.o) mv.cameraOrbit = view.o;
      if (view.t) mv.cameraTarget = view.t;
      if (view.f) mv.fieldOfView = view.f;
      if (view.x != null) {
        mv.exposure = view.x;
        exposureInput.value = view.x;
        exposureOut.textContent = Number(view.x).toFixed(2);
      }
      if (view.s != null) {
        mv.shadowIntensity = view.s;
        shadowInput.value = view.s;
        shadowOut.textContent = Number(view.s).toFixed(2);
      }
      if (view.r != null) {
        autoRotate.checked = !!view.r;
        mv.autoRotate = !!view.r;
      }
      if (view.e) document.body.classList.add('is-embed');
      return true;
    }

    function viewerBaseUrl() {
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      return url.href;
    }

    function buildViewUrl(view = captureView()) {
      const url = new URL(viewerBaseUrl(), window.location.href);
      url.searchParams.set('v', encodeView(view));
      if (view.e) url.searchParams.set('embed', '1');
      return url.toString();
    }

    function buildEmbedMarkdown(view = captureView({ embed: true })) {
      const src = buildViewUrl({ ...view, e: 1 });
      return [
        '<iframe',
        `  src="${src}"`,
        '  title="OD-11 3D model"',
        '  style="width:100%;aspect-ratio:16/10;border:0;border-radius:0;background:#0c0e12"',
        '  loading="lazy"',
        '  allow="xr-spatial-tracking; fullscreen"',
        '  allowfullscreen',
        '></iframe>',
      ].join('\n');
    }

    function readInitialView() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('embed') === '1') document.body.classList.add('is-embed');
      const raw = params.get('v') || (window.location.hash.startsWith('#v=')
        ? window.location.hash.slice(3)
        : '');
      return raw ? decodeView(raw) : null;
    }

    const initialView = readInitialView();

    exposureInput.addEventListener('input', () => {
      const v = Number(exposureInput.value);
      mv.exposure = v;
      exposureOut.textContent = v.toFixed(2);
    });

    shadowInput.addEventListener('input', () => {
      const v = Number(shadowInput.value);
      mv.shadowIntensity = v;
      shadowOut.textContent = v.toFixed(2);
    });

    autoRotate.addEventListener('change', () => {
      mv.autoRotate = autoRotate.checked;
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      mv.cameraOrbit = DEFAULT_ORBIT;
      mv.cameraTarget = DEFAULT_TARGET;
      mv.fieldOfView = DEFAULT_FOV;
      mv.jumpCameraToGoal();
      showToast('View reset');
    });

    document.getElementById('btn-ar').addEventListener('click', () => {
      if (mv.canActivateAR) mv.activateAR();
      else showToast('AR not available on this device / browser');
    });

    document.getElementById('btn-copy-embed').addEventListener('click', async () => {
      const md = buildEmbedMarkdown(captureView({ embed: true }));
      const ok = await copyText(md);
      showToast(ok ? 'Embed markdown copied — paste into your blog post' : 'Could not copy — select from console');
      if (!ok) console.log(md);
    });

    document.getElementById('btn-copy-url').addEventListener('click', async () => {
      const url = buildViewUrl(captureView({ embed: false }));
      const ok = await copyText(url);
      showToast(ok ? 'View URL copied' : 'Could not copy URL');
      if (!ok) console.log(url);
    });

    mv.addEventListener('progress', (event) => {
      const total = event.detail?.totalProgress;
      if (typeof total === 'number') setProgress(total);
    });

    mv.addEventListener('load', () => {
      setProgress(1);
      loaderEl.classList.add('is-done');
      status.textContent = 'Ready';
      if (initialView) applyView(initialView);
    });

    mv.addEventListener('error', () => {
      loaderLabel.className = 'error';
      loaderLabel.textContent =
        'Could not load OD-11.glb. Serve this folder over HTTP (e.g. npx serve) — opening the file directly will fail.';
      pct.textContent = '';
      status.textContent = 'Error';
    });
  </script>
</body>
</html>
